
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostor Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #ff4757, #ff7f50, #2c1674); /* Mistura de Vermelho, Laranja e uma base escura para contraste */
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* Efeito de bolhas de fundo em tons quentes */
        .bg-bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.15); /* Amarelo translúcido */
            animation: float 20s infinite linear;
        }
        .bubble:nth-child(even) {
            background: rgba(255, 69, 0, 0.1); /* Laranja translúcido */
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="bg-bubbles">
        <div class="bubble" style="width: 80px; height: 80px; left: 10%; animation-delay: 0s;"></div>
        <div class="bubble" style="width: 40px; height: 40px; left: 20%; animation-delay: 2s;"></div>
        <div class="bubble" style="width: 60px; height: 60px; left: 35%; animation-delay: 4s;"></div>
        <div class="bubble" style="width: 90px; height: 90px; left: 50%; animation-delay: 1s;"></div>
        <div class="bubble" style="width: 50px; height: 50px; left: 65%; animation-delay: 5s;"></div>
        <div class="bubble" style="width: 70px; height: 70px; left: 85%; animation-delay: 3s;"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
